<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surat Untuk Sania ❤️</title>

<link rel="stylesheet" href="letter.css">
<link rel="stylesheet" href="flower.css">
<link rel="stylesheet" href="heart.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div id="flowers"></div>

<div id="hearts"></div>


<!-- =========================
     SURAT
========================= -->

<div class="paper">

    <h1>Untuk Sania ❤️</h1>

    <div id="letterContent">
        Memuat surat...
    </div>

    <div class="bottom">

        <button id="nextBtn">
            Lihat Kenangan 📸
        </button>

    </div>

</div>


<!-- =========================
     MUSIK
========================= -->

<audio id="music" loop preload="auto">

    <source
        src="assets/music/song.mp3"
        type="audio/mpeg">

</audio>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="config.js"></script>

<script src="flower.js"></script>

<script src="heart.js"></script>

<script src="letter.js"></script>


<script>

/* =========================
   MUSIK
========================= */

const music = document.getElementById("music");

function playMusic(){

    if(!music) return;

    music.volume = 0.7;

    const playPromise = music.play();

    if(playPromise !== undefined){

        playPromise.catch(() => {

            // Browser HP mungkin memblokir autoplay.
            // Musik akan dicoba lagi ketika user menyentuh layar.

        });

    }

}


/* Coba memainkan musik ketika halaman selesai dimuat */

window.addEventListener("load", () => {

    playMusic();

});


/* Jika autoplay diblokir,
   sentuhan pertama akan menjalankan musik */

document.addEventListener("click", () => {

    playMusic();

}, { once:true });


document.addEventListener("touchstart", () => {

    playMusic();

}, { once:true });


/* =========================
   TOMBOL KE GALERI
========================= */

const nextBtn = document.getElementById("nextBtn");

if(nextBtn){

    nextBtn.addEventListener("click", () => {

        /*
         * Pastikan musik tetap dimainkan
         * sebelum pindah halaman.
         */

        playMusic();

        window.location.href = "gallery.html";

    });

}

</script>

</body>

</html>
