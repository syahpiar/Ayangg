<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surat Untuk Sania ❤️</title>

<link rel="stylesheet" href="letter.css">
<link rel="stylesheet" href="flower.css">
<link rel="stylesheet" href="heart.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="background"></div>

<div id="flowers"></div>

<div id="hearts"></div>


<div class="paper">

    <h1>Untuk Sania ❤️</h1>

    <div id="letterContent">
        Memuat surat...
    </div>

    <div class="bottom">

        <button id="nextBtn">
            Lihat Kenangan 📸
        </button>

    </div>

</div>


<!-- =========================
     MUSIK
========================= -->

<audio
    id="music"
    src="assets/music/song.mp3"
    loop
    preload="auto">
</audio>


<script src="config.js"></script>
<script src="flower.js"></script>
<script src="heart.js"></script>
<script src="letter.js"></script>


<script>

/* =========================
   MUSIC
========================= */

const music = document.getElementById("music");

music.volume = 0.7;


/*
   Coba langsung memainkan musik
   ketika halaman letter dibuka.
*/

window.addEventListener("load", function(){

    music.play().catch(function(){

        /*
         * Jika browser memblokir autoplay,
         * musik akan dimainkan ketika user
         * menyentuh layar.
         */

    });

});


/*
   Fallback untuk HP.
   Begitu user menyentuh layar,
   musik langsung dimainkan.
*/

function startMusic(){

    if(music.paused){

        music.play().catch(function(){});

    }

}

document.addEventListener(
    "touchstart",
    startMusic,
    { once:true }
);

document.addEventListener(
    "click",
    startMusic,
    { once:true }
);


/* =========================
   NEXT BUTTON
========================= */

const nextBtn = document.getElementById("nextBtn");

if(nextBtn){

    nextBtn.addEventListener("click", function(){

        startMusic();

        window.location.href = "gallery.html";

    });

}

</script>

</body>

</html>
